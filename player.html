<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-black">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Totem Play - Exibidor de Vídeo</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK Compat (para funcionamento instantâneo) -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>

  <style>
    /* Ocultar barra de rolagem e manter imersão total */
    body {
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .video-fade {
      transition: opacity 0.5s ease-in-out;
    }
  </style>
</head>
<body class="h-full w-full flex items-center justify-center bg-black text-white relative">

  <!-- Container do Player de Vídeo -->
  <div id="videoContainer" class="w-full h-full relative overflow-hidden flex items-center justify-center">
    <video
      id="mainVideo"
      class="w-full h-full object-contain video-fade opacity-0"
      autoplay
      loop
      playsinline
      muted
    ></video>

    <!-- Overlay de Carregamento / Transição -->
    <div id="loadingOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/90 z-20 transition-opacity duration-300">
      <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500 mb-4"></div>
      <p id="loadingText" class="text-gray-300 text-lg font-medium">Aguardando sinal de vídeo...</p>
    </div>

    <!-- Barra de Status Discreta no Topo (Fica transparente/some e aparece no toque) -->
    <header id="topBar" class="absolute top-0 left-0 right-0 p-4 bg-gradient-to-b from-black/80 to-transparent z-30 flex items-center justify-between transition-opacity duration-500 opacity-90 hover:opacity-100">
      <div class="flex items-center space-x-3">
        <span id="statusIndicator" class="flex h-3 w-3 relative">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        </span>
        <div class="flex flex-col">
          <span id="videoTitleDisplay" class="text-sm font-semibold text-white tracking-wide truncate max-w-[200px] sm:max-w-md">
            Carregando...
          </span>
          <span id="connectionBadge" class="text-[10px] text-gray-400">
            Conectando em tempo real...
          </span>
        </div>
      </div>

      <!-- Ações Rápidas do Display -->
      <div class="flex items-center space-x-2">
        <!-- Botão de Ativar/Desativar Som -->
        <button id="toggleAudioBtn" class="p-2.5 rounded-full bg-white/10 backdrop-blur hover:bg-white/20 active:scale-95 transition" title="Alternar Som">
          <svg id="audioMutedIcon" class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
          </svg>
          <svg id="audioActiveIcon" class="w-5 h-5 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
          </svg>
        </button>

        <!-- Botão Tela Cheia -->
        <button id="fullscreenBtn" class="p-2.5 rounded-full bg-white/10 backdrop-blur hover:bg-white/20 active:scale-95 transition" title="Tela Cheia">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0 0l-5-5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
          </svg>
        </button>

        <!-- Botão Abrir Painel / Modo Admin -->
        <a href="admin.html" class="p-2.5 rounded-full bg-blue-600/80 hover:bg-blue-600 text-white backdrop-blur transition" title="Ir para Painel de Controle">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </a>
      </div>
    </header>

    <!-- Notificação Flutuante de Troca de Vídeo -->
    <div id="toast" class="absolute bottom-6 bg-blue-600/90 backdrop-blur-md text-white px-5 py-2.5 rounded-full shadow-2xl flex items-center space-x-2 z-40 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
      <span id="toastMsg" class="text-sm font-medium">Novo vídeo acionado!</span>
    </div>
  </div>

  <!-- Scripts -->
  <script src="sync-engine.js"></script>
  <script>
    const video = document.getElementById('mainVideo');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const videoTitleDisplay = document.getElementById('videoTitleDisplay');
    const connectionBadge = document.getElementById('connectionBadge');
    const toggleAudioBtn = document.getElementById('toggleAudioBtn');
    const audioMutedIcon = document.getElementById('audioMutedIcon');
    const audioActiveIcon = document.getElementById('audioActiveIcon');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const topBar = document.getElementById('topBar');

    let currentVideoUrl = null;
    let wakeLock = null;
    let hideBarTimeout = null;

    // Função para mostrar aviso flutuante
    function showToast(message) {
      toastMsg.textContent = message;
      toast.classList.remove('opacity-0', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-4');
      }, 3500);
    }

    // Auto-ocultar a barra superior após 4 segundos para tela limpa
    function scheduleHideTopBar() {
      clearTimeout(hideBarTimeout);
      hideBarTimeout = setTimeout(() => {
        topBar.classList.add('opacity-0');
      }, 4000);
    }

    window.addEventListener('mousemove', () => {
      topBar.classList.remove('opacity-0');
      scheduleHideTopBar();
    });

    window.addEventListener('touchstart', () => {
      topBar.classList.remove('opacity-0');
      scheduleHideTopBar();
    });

    scheduleHideTopBar();

    // 1. Manter tela acesa sem apagar (Screen Wake Lock API)
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => {
            console.log('Wake Lock liberado.');
          });
          console.log('✅ Wake Lock ativado: a tela do celular não apagará.');
        }
      } catch (err) {
        console.warn('Wake Lock não suportado ou bloqueado:', err);
      }
    }

    // Reativar Wake Lock se o app voltar do segundo plano
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    // 2. Transição e reprodução do novo vídeo
    function playVideo(videoData) {
      if (!videoData || !videoData.url) return;

      if (currentVideoUrl === videoData.url) {
        console.log('O vídeo recebido já está em reprodução.');
        return;
      }

      currentVideoUrl = videoData.url;
      videoTitleDisplay.textContent = videoData.title || 'Exibindo Vídeo';
      showToast(`▶ Trocou para: ${videoData.title || 'Novo Vídeo'}`);

      // Transição visual com Fade
      video.classList.remove('opacity-100');
      video.classList.add('opacity-0');
      loadingOverlay.classList.remove('opacity-0', 'pointer-events-none');
      loadingText.textContent = `Carregando: ${videoData.title || 'Vídeo'}...`;

      video.src = videoData.url;
      video.load();

      video.oncanplay = () => {
        video.play().then(() => {
          loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
          video.classList.remove('opacity-0');
          video.classList.add('opacity-100');
          requestWakeLock();
        }).catch(err => {
          console.warn('Autoplay com áudio bloqueado. Tentando no mudo:', err);
          video.muted = true;
          video.play().then(() => {
            loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
            video.classList.remove('opacity-0');
            video.classList.add('opacity-100');
          });
        });
      };

      video.onerror = (e) => {
        console.error('Erro ao reproduzir mídia:', e);
        loadingOverlay.classList.remove('opacity-0', 'pointer-events-none');
        loadingText.textContent = 'Erro ao carregar o vídeo. Verifique se o link é válido.';
      };
    }

    // 3. Controle de Áudio
    toggleAudioBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      if (video.muted) {
        audioMutedIcon.classList.remove('hidden');
        audioActiveIcon.classList.add('hidden');
        showToast('Áudio silenciado 🔇');
      } else {
        audioMutedIcon.classList.add('hidden');
        audioActiveIcon.classList.remove('hidden');
        showToast('Áudio ativado 🔊');
      }
    });

    // 4. Controle de Tela Cheia
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn('Erro ao solicitar tela cheia:', err);
        });
      } else {
        document.exitFullscreen();
      }
    });

    // 5. Configuração dos eventos do SyncEngine (Banco de Dados em Tempo Real)
    window.syncEngine.callbacks.onVideoChanged = (videoData) => {
      console.log('⚡ Evento em tempo real recebido:', videoData);
      playVideo(videoData);
    };

    window.syncEngine.callbacks.onStatusChanged = (status) => {
      connectionBadge.textContent = status.message;
      const dot = document.getElementById('statusIndicator');
      if (status.connected) {
        dot.children[0].className = 'animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75';
        dot.children[1].className = 'relative inline-flex rounded-full h-3 w-3 bg-emerald-500';
      } else {
        dot.children[0].className = 'animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75';
        dot.children[1].className = 'relative inline-flex rounded-full h-3 w-3 bg-amber-500';
      }
    };

    // Iniciar Wake Lock logo na primeira interação
    window.addEventListener('click', () => {
      requestWakeLock();
    }, { once: true });

    // Registrar Service Worker PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(() => {
        console.log('PWA Service Worker registrado com sucesso.');
      }).catch(err => console.warn('Falha no SW:', err));
    }
  </script>
</body>
</html>
